<div class="space-y-6">
  <section class="flex flex-col gap-4 rounded-3xl border border-slate-200 bg-white p-5 shadow-sm lg:flex-row lg:items-center lg:justify-between">
    <div>
      <h2 class="text-2xl font-bold text-slate-950">Task Board</h2>
      <p class="mt-1 text-sm text-slate-500">
        Track tasks by status, owner, priority, and due date.
      </p>
    </div>

    <button
      type="button"
      class="inline-flex items-center justify-center gap-2 rounded-2xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700"
    >
      <lucide-icon [name]="PlusIcon" class="h-5 w-5"></lucide-icon>
      New Task
    </button>
  </section>

  <section class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="flex w-full items-center rounded-2xl border border-slate-200 bg-slate-50 px-3 lg:max-w-md">
      <lucide-icon [name]="SearchIcon" class="h-4 w-4 text-slate-400"></lucide-icon>

      <input
        type="text"
        placeholder="Search tasks, projects, or assignees"
        class="w-full bg-transparent px-3 py-3 text-sm outline-none placeholder:text-slate-400"
        [value]="searchTerm()"
        (input)="setSearchTerm($event)"
      />
    </div>
  </section>

  <section class="grid gap-5 xl:grid-cols-4">
    <div
      *ngFor="let column of columns"
      class="rounded-3xl border border-slate-200 bg-slate-100/70 p-4"
    >
      <div class="mb-4 flex items-center justify-between">
        <h3 class="font-bold text-slate-950">
          {{ column }}
        </h3>

        <span class="rounded-full bg-white px-2.5 py-1 text-xs font-bold text-slate-600">
          {{ getTasksByStatus(column).length }}
        </span>
      </div>

      <div class="space-y-4">
        <article
          *ngFor="let task of getTasksByStatus(column)"
          class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"
        >
          <div class="flex items-start justify-between gap-3">
            <span
              class="rounded-full px-2.5 py-1 text-xs font-semibold"
              [ngClass]="getPriorityClass(task.priority)"
            >
              {{ task.priority }}
            </span>

            <button class="rounded-xl p-1 text-slate-400 hover:bg-slate-100">
              <lucide-icon [name]="MoreIcon" class="h-5 w-5"></lucide-icon>
            </button>
          </div>

          <h4 class="mt-4 text-sm font-bold text-slate-950">
            {{ task.title }}
          </h4>

          <p class="mt-2 line-clamp-2 text-sm leading-5 text-slate-500">
            {{ task.description }}
          </p>

          <p class="mt-3 text-xs font-semibold text-blue-700">
            {{ task.project }}
          </p>

          <div class="mt-4 space-y-2 border-t border-slate-100 pt-4 text-xs text-slate-500">
            <div class="flex items-center gap-2">
              <lucide-icon [name]="UserIcon" class="h-4 w-4"></lucide-icon>
              {{ task.assignee }}
            </div>

            <div class="flex items-center gap-2">
              <lucide-icon [name]="CalendarIcon" class="h-4 w-4"></lucide-icon>
              {{ task.dueDate }}
            </div>
          </div>
        </article>
      </div>
    </div>
  </section>
</div>
